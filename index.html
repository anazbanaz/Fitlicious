<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>fitlicious</title>
    
    <link rel="manifest" href="./manifest.json">
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --bg-color: #121212; --text-color: #ffffff; --card-bg: #1e1e1e; --card-border: #333; --accent: #00bcd4; }
        [data-theme="light"] { --bg-color: #f0f0f0; --text-color: #121212; --card-bg: #ffffff; --card-border: #cccccc; --accent: #009688; }
        
        body { margin: 0; padding: 0; font-family: sans-serif; background: var(--bg-color); color: var(--text-color); overflow-x: hidden; transition: 0.3s; padding-bottom: 70px; }
        * { box-sizing: border-box; }
        
        .screen { display: none; min-height: 100vh; flex-direction: column; }
        .active-screen { display: flex; }
        
        /* Header - Invisible */
        header { display: flex; justify-content: flex-end; align-items: center; padding: 15px 20px; background: transparent; border: none; position: sticky; top: 0; z-index: 10; pointer-events: none; }
        .menu-container { position: relative; pointer-events: auto; }
        .icon-btn { background: none; border: none; color: var(--text-color); font-size: 24px; cursor: pointer; padding: 0 5px; }
        .dropdown { display: none; position: absolute; right: 0; top: 100%; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; min-width: 170px; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); overflow: hidden; margin-top: 5px; }
        .dropdown button { width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--card-border); padding: 12px; color: var(--text-color); cursor: pointer; font-size: 14px; }
        .dropdown button:last-child { border-bottom: none; }
        
        .content { padding: 20px; flex-grow: 1; padding-top: 0; }
        button, .btn { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--card-border); padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; }
        .btn-primary { background: var(--accent); color: #fff; border: none; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-color); margin-bottom: 10px; }
        
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; margin-top: -30px; }
        .cal-header h3 { margin: 0; cursor: pointer; padding: 5px 10px; border-radius: 8px; border: 1px solid transparent; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .cal-day-header { font-weight: bold; font-size: 12px; opacity: 0.7; padding-bottom: 10px; }
        .cal-day { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; min-height: 60px; padding: 5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .cal-day.empty { background: transparent; border: none; cursor: default; }
        .cal-day.today { border-color: var(--accent); color: var(--accent); font-weight: bold; }
        .plan-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; margin: 2px 1px; display: inline-block; }
        
        .footer { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg); border-top: 1px solid var(--card-border); display: flex; padding: 10px; z-index: 10; }
        .footer button { flex: 1; margin: 0 5px; background: transparent; border: none; font-size: 24px; padding: 5px; }
        .footer button.active { color: var(--accent); }
        
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .overlay-content { background: var(--bg-color); width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; border: 1px solid var(--card-border); max-height: 80vh; overflow-y: auto; }
        
        .list-item { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Workout Execution UI */
        .log-layout { display: flex; flex-direction: column; height: 100vh; }
        .log-exercises { flex-grow: 1; overflow-y: auto; padding-bottom: 20px; }
        .log-exercise-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .set-row { display: grid; grid-template-columns: 40px 1fr 1fr 40px; gap: 10px; align-items: center; margin-bottom: 10px; }
        .set-row input { margin: 0; padding: 10px; text-align: center; }
        
        /* Timer UI */
        .timer-container { background: var(--card-bg); border-top: 2px solid var(--card-border); padding: 15px; position: sticky; bottom: 0; z-index: 5; }
        .timer-settings { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .timer-settings input { margin: 0; text-align: center; font-weight: bold; }
        .timer-settings label { font-size: 10px; text-align: center; display: block; opacity: 0.7; margin-bottom: 2px; }
        .timer-display { text-align: center; font-size: 48px; font-weight: bold; margin: 10px 0; color: var(--accent); font-variant-numeric: tabular-nums; }
        .timer-status { text-align: center; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; margin-bottom: 10px; }
        .timer-controls { display: flex; gap: 10px; }
        .timer-controls button { margin: 0; }
        #btn-timer-pause { display: none; }
        
        /* Heatmap Grid */
        .heatmap-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
        .heatmap-box { padding-top: 100%; border-radius: 4px; position: relative; background: var(--card-bg); }
        .heatmap-box[data-intensity="1"] { background: rgba(0, 188, 212, 0.3); }
        .heatmap-box[data-intensity="2"] { background: rgba(0, 188, 212, 0.6); }
        .heatmap-box[data-intensity="3"] { background: rgba(0, 188, 212, 1); }
        
    </style>
</head>
<body>

    <header>
        <div class="menu-container">
            <button class="icon-btn" onclick="toggleMenu()">☰</button>
            <div id="main-menu" class="dropdown">
                <button onclick="toggleTheme()">☀️/🌙 Theme wechseln</button>
                <button onclick="openSettingsModal()">⚙️ Einstellungen</button>
                <button onclick="exportData()">💾 Export Backup</button>
                <label style="display:block;"><button onclick="document.getElementById('import-file').click()">📂 Import Backup</button><input type="file" id="import-file" style="display:none;" onchange="importData(event)"></label>
            </div>
        </div>
    </header>

    <div id="screen-calendar" class="screen active-screen">
        <div class="content">
            <div class="cal-header">
                <button class="icon-btn" onclick="changeMonth(-1)">◀</button>
                <h3 onclick="openMonthYearSelector()" id="current-month-year"></h3>
                <button class="icon-btn" onclick="changeMonth(1)">▶</button>
            </div>
            <div class="cal-grid" id="cal-headers">
                <div class="cal-day-header">Mo</div><div class="cal-day-header">Di</div><div class="cal-day-header">Mi</div>
                <div class="cal-day-header">Do</div><div class="cal-day-header">Fr</div><div class="cal-day-header">Sa</div><div class="cal-day-header">So</div>
            </div>
            <div class="cal-grid" id="calendar-grid"></div>
        </div>
    </div>

    <div id="screen-progress" class="screen">
        <div class="content" style="padding-top: 0;">
            <h3 style="margin-top:0;">📈 Fortschritt</h3>
            <select id="chart-type" onchange="renderCharts()">
                <option value="max">Maximalgewicht (Linie)</option>
                <option value="vol">Trainingsvolumen (Balken)</option>
                <option value="muscle">Muskelgruppen (Kreis)</option>
                <option value="heatmap">Aktivität (Heatmap)</option>
                <option value="records">Personal Records (Liste)</option>
            </select>
            <select id="chart-exercise" onchange="renderCharts()" style="display:none;"></select>
            
            <div id="canvas-container" style="position: relative; height:40vh; width:100%; margin-top:20px;">
                <canvas id="progressChart"></canvas>
            </div>
            <div id="html-chart-container" style="display:none; margin-top:20px;"></div>
        </div>
    </div>

    <div id="screen-create" class="screen">
        <div class="content" style="padding-top: 0;">
            <h3 style="margin-top:0;">➕ Plan erstellen</h3>
            <input type="text" id="plan-name" placeholder="Name des Trainingsplans...">
            <div id="plan-exercises"></div>
            <button class="btn" onclick="openExerciseModal()">+ Übung hinzufügen</button>
            <button class="btn-primary" onclick="savePlan()">💾 Plan speichern</button>
        </div>
    </div>

    <div id="screen-manage" class="screen">
        <div class="content" style="padding-top: 0;">
            <h3 style="margin-top:0;">📋 Meine Pläne</h3>
            <div id="plans-list"></div>
        </div>
    </div>

    <div id="screen-log" class="screen" style="padding-bottom: 0;">
        <div class="log-layout">
            <div style="padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border);">
                <button class="icon-btn" onclick="closeLogScreen()" style="margin:0; width:auto; padding:0;">◀ Zurück</button>
                <h3 id="log-title" style="margin:0; color: var(--accent);"></h3>
                <button class="btn-primary" onclick="saveWorkoutLog()" style="margin:0; width:auto; padding:8px 15px;">Speichern</button>
            </div>
            
            <div class="content log-exercises" id="log-exercises-container"></div>

            <div class="timer-container">
                <div class="timer-settings">
                    <div><label>Arbeit (sek)</label><input type="number" id="timer-work" value="45" onchange="updateTimerSettings()"></div>
                    <div><label>Pause (sek)</label><input type="number" id="timer-rest" value="60" onchange="updateTimerSettings()"></div>
                    <div><label>Runden</label><input type="number" id="timer-rounds" value="3" onchange="updateTimerSettings()"></div>
                </div>
                <div class="timer-status" id="timer-status">Bereit</div>
                <div class="timer-display" id="timer-display">00:00</div>
                <div class="timer-controls">
                    <button class="btn-primary" id="btn-timer-start" onclick="startTimer()">▶ Start</button>
                    <button class="btn" id="btn-timer-pause" onclick="pauseTimer()">⏸ Pause</button>
                    <button class="btn" style="color:#f44;" onclick="stopTimer()">⏹ Stopp</button>
                </div>
            </div>
        </div>
    </div>

    <div class="footer" id="main-footer">
        <button id="nav-progress" onclick="switchScreen('screen-progress')">📈</button>
        <button id="nav-create" onclick="switchScreen('screen-create')">➕</button>
        <button id="nav-manage" onclick="switchScreen('screen-manage')">📋</button>
        <button id="nav-calendar" onclick="switchScreen('screen-calendar')" class="active">📅</button>
    </div>

    <div id="modal-date-select" class="overlay">
        <div class="overlay-content">
            <h3>Monat & Jahr wählen</h3>
            <div style="display:flex; gap:10px;">
                <select id="select-month">
                    <option value="0">Januar</option><option value="1">Februar</option><option value="2">März</option>
                    <option value="3">April</option><option value="4">Mai</option><option value="5">Juni</option>
                    <option value="6">Juli</option><option value="7">August</option><option value="8">September</option>
                    <option value="9">Oktober</option><option value="10">November</option><option value="11">Dezember</option>
                </select>
                <select id="select-year"></select>
            </div>
            <button class="btn-primary" onclick="applyDateSelection()">Auswählen</button>
            <button class="btn" onclick="closeModals()">Abbrechen</button>
        </div>
    </div>

    <div id="modal-settings" class="overlay">
        <div class="overlay-content">
            <h3>⚙️ Einstellungen</h3>
            <label style="display:block; font-weight:bold; margin-bottom:5px;">Sound: Arbeit (Start)</label>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <select id="select-sound-work" onchange="saveSoundSettings()">
                    <option value="whistle">Schiedsrichter-Pfeife</option>
                    <option value="bell">Box-Glocke</option>
                    <option value="buzzer">Buzzer</option>
                    <option value="beep">Normaler Beep</option>
                </select>
                <button class="btn" style="margin:0; width:auto; padding:12px;" onclick="testSound('work')">▶</button>
            </div>
            <label style="display:block; font-weight:bold; margin-bottom:5px;">Sound: Pause</label>
            <div style="display:flex; gap:10px; margin-bottom:25px;">
                <select id="select-sound-rest" onchange="saveSoundSettings()">
                    <option value="bell">Box-Glocke</option>
                    <option value="whistle">Schiedsrichter-Pfeife</option>
                    <option value="buzzer">Buzzer</option>
                    <option value="beep">Normaler Beep</option>
                </select>
                <button class="btn" style="margin:0; width:auto; padding:12px;" onclick="testSound('rest')">▶</button>
            </div>
            <button class="btn-primary" onclick="closeModals()">Schließen</button>
        </div>
    </div>

    <div id="modal-exercise" class="overlay">
        <div class="overlay-content">
            <h3>Übung auswählen</h3>
            <select id="xml-exercise-list"></select>
            <p style="text-align:center; margin:10px 0;">Oder Eigene:</p>
            <input type="text" id="custom-exercise" placeholder="Eigene Übung eingeben...">
            <button class="btn-primary" onclick="addExerciseToPlan()">Hinzufügen</button>
            <button class="btn" onclick="closeModals()">Abbrechen</button>
        </div>
    </div>

    <div id="modal-day" class="overlay">
        <div class="overlay-content">
            <h3 id="day-modal-title"></h3>
            <div id="day-plans-container" style="margin-bottom:20px;">
                <h4>Geplante Workouts:</h4>
                <div id="day-assigned-plans"></div>
            </div>
            <h4>Plan zuweisen:</h4>
            <select id="assign-plan-select"></select>
            <button class="btn-primary" onclick="assignPlanToDay()">Zuweisen</button>
            <hr style="border-color:var(--card-border); margin:20px 0;">
            <button class="btn" onclick="closeModals()">Schließen</button>
        </div>
    </div>

    <script>
        const exercisesXML = `<?xml version="1.0" encoding="UTF-8"?>
        <exercises>
            <exercise category="Brust">Bankdrücken</exercise>
            <exercise category="Brust">Liegestütze</exercise>
            <exercise category="Rücken">Klimmzüge</exercise>
            <exercise category="Rücken">Kreuzheben</exercise>
            <exercise category="Rücken">Langhantelrudern</exercise>
            <exercise category="Beine">Kniebeugen</exercise>
            <exercise category="Beine">Beinpresse</exercise>
            <exercise category="Beine">Ausfallschritte</exercise>
            <exercise category="Schultern">Schulterdrücken</exercise>
            <exercise category="Schultern">Seitheben</exercise>
            <exercise category="Arme">Bizepscurls</exercise>
            <exercise category="Arme">Trizepsdrücken</exercise>
            <exercise category="Bauch">Crunches</exercise>
            <exercise category="Bauch">Planks</exercise>
        </exercises>`;

        let data = JSON.parse(localStorage.getItem('fitlicious_data')) || { plans: [], schedule: {}, logs: {}, settings: {} };
        if (!data.settings.soundWork) data.settings.soundWork = 'whistle';
        if (!data.settings.soundRest) data.settings.soundRest = 'bell';

        let currentDate = new Date();
        let currentTempPlan = [];
        let selectedDateStr = "";
        let selectedPlanIdToLog = null;
        let activeLogData = [];
        let chartInstance = null;
        let exerciseCategoryMap = {};

        // Timer Vars
        let timerInterval = null;
        let timerState = 'idle'; 
        let timeLeft = 0;
        let currentRound = 1;
        let totalRounds = 1;
        let audioCtx = null;

        const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

        window.onload = () => {
            initXML();
            populateYearSelect();
            renderCalendar();
            updateTimerDisplayUI(parseInt(document.getElementById('timer-work').value));
        };

        function saveData() { localStorage.setItem('fitlicious_data', JSON.stringify(data)); }

        function initXML() {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(exercisesXML, "text/xml");
            const exercises = xmlDoc.getElementsByTagName("exercise");
            const select = document.getElementById('xml-exercise-list');
            for(let i=0; i<exercises.length; i++) {
                let opt = document.createElement('option');
                opt.value = exercises[i].textContent;
                opt.innerHTML = `[${exercises[i].getAttribute('category')}] ${exercises[i].textContent}`;
                select.appendChild(opt);
                exerciseCategoryMap[exercises[i].textContent] = exercises[i].getAttribute('category');
            }
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(id).classList.add('active-screen');
            document.querySelectorAll('.footer button').forEach(b => b.classList.remove('active'));
            if(document.getElementById('nav-' + id.split('-')[1])) {
                document.getElementById('nav-' + id.split('-')[1]).classList.add('active');
            }
            document.getElementById('main-footer').style.display = (id === 'screen-log') ? 'none' : 'flex';
            if(id === 'screen-manage') renderManagePlans();
            if(id === 'screen-calendar') renderCalendar();
            if(id === 'screen-progress') setupProgressScreen();
        }

        function toggleMenu() {
            const menu = document.getElementById('main-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function toggleTheme() {
            const root = document.documentElement;
            root.setAttribute('data-theme', root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            toggleMenu();
            if(document.getElementById('screen-progress').classList.contains('active-screen')) renderCharts();
        }

        function closeModals() { document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none'); }

        function openSettingsModal() {
            document.getElementById('select-sound-work').value = data.settings.soundWork;
            document.getElementById('select-sound-rest').value = data.settings.soundRest;
            document.getElementById('modal-settings').style.display = 'flex';
            toggleMenu();
        }
        function saveSoundSettings() {
            data.settings.soundWork = document.getElementById('select-sound-work').value;
            data.settings.soundRest = document.getElementById('select-sound-rest').value;
            saveData();
        }
        function testSound(type) {
            initAudio();
            const val = type === 'work' ? document.getElementById('select-sound-work').value : document.getElementById('select-sound-rest').value;
            playSoundEffect(val);
        }

        function populateYearSelect() {
            const select = document.getElementById('select-year');
            const year = new Date().getFullYear();
            for(let i = year - 5; i <= year + 5; i++) { select.innerHTML += `<option value="${i}">${i}</option>`; }
        }

        function changeMonth(dir) { currentDate.setMonth(currentDate.getMonth() + dir); renderCalendar(); }

        function openMonthYearSelector() {
            document.getElementById('select-month').value = currentDate.getMonth();
            document.getElementById('select-year').value = currentDate.getFullYear();
            document.getElementById('modal-date-select').style.display = 'flex';
        }

        function applyDateSelection() {
            const m = parseInt(document.getElementById('select-month').value);
            const y = parseInt(document.getElementById('select-year').value);
            currentDate = new Date(y, m, 1);
            renderCalendar(); closeModals();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('current-month-year').innerText = `${monthNames[month]} ${year}`;
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            const firstDay = new Date(year, month, 1).getDay();
            const offset = firstDay === 0 ? 6 : firstDay - 1; 
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const todayStr = new Date().toISOString().split('T')[0];
            for(let i = 0; i < offset; i++) grid.innerHTML += `<div class="cal-day empty"></div>`;
            for(let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday = dateStr === todayStr ? 'today' : '';
                let dotsHtml = '';
                if(data.schedule[dateStr]) data.schedule[dateStr].forEach(() => { dotsHtml += `<div class="plan-dot"></div>`; });
                grid.innerHTML += `<div class="cal-day ${isToday}" onclick="openDayModal('${dateStr}')">${d}<div style="margin-top:5px;">${dotsHtml}</div></div>`;
            }
        }

        function openDayModal(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('day-modal-title').innerText = "Tag: " + dateStr;
            const list = document.getElementById('day-assigned-plans');
            list.innerHTML = '';
            if(data.schedule[dateStr]) {
                data.schedule[dateStr].forEach((planId) => {
                    const plan = data.plans.find(p => p.id === planId);
                    if(plan) {
                        list.innerHTML += `<div class="list-item" style="padding:10px;"><span>${plan.name}</span><button class="btn-primary" style="width:auto; margin:0; padding:8px;" onclick="openLogScreen(${plan.id})">Ausführen</button></div>`;
                    }
                });
            } else { list.innerHTML = `<p style="opacity:0.5; font-size:14px;">Keine Pläne.</p>`; }
            const select = document.getElementById('assign-plan-select');
            select.innerHTML = '';
            data.plans.forEach(p => { select.innerHTML += `<option value="${p.id}">${p.name}</option>`; });
            document.getElementById('modal-day').style.display = 'flex';
        }

        function assignPlanToDay() {
            const planId = parseInt(document.getElementById('assign-plan-select').value);
            if(!planId) return;
            if(!data.schedule[selectedDateStr]) data.schedule[selectedDateStr] = [];
            data.schedule[selectedDateStr].push(planId);
            saveData(); openDayModal(selectedDateStr); renderCalendar();
        }

        function openLogScreen(planId) {
            closeModals();
            selectedPlanIdToLog = planId;
            const plan = data.plans.find(p => p.id === planId);
            document.getElementById('log-title').innerText = plan.name;
            const existingLog = (data.logs[selectedDateStr] || []).find(l => l.planId === planId);
            activeLogData = [];
            plan.exercises.forEach((ex, idx) => {
                let sets = [{ weight: "", reps: "" }]; 
                if(existingLog && existingLog.exercises[idx]) sets = JSON.parse(JSON.stringify(existingLog.exercises[idx].sets));
                activeLogData.push({ name: ex, sets: sets });
            });
            renderLogExercises(); switchScreen('screen-log');
        }

        function closeLogScreen() { stopTimer(); switchScreen('screen-calendar'); }

        function renderLogExercises() {
            const container = document.getElementById('log-exercises-container');
            container.innerHTML = '';
            activeLogData.forEach((ex, exIdx) => {
                let setsHtml = '';
                ex.sets.forEach((set, setIdx) => {
                    setsHtml += `<div class="set-row"><span style="font-weight:bold; opacity:0.6;">${setIdx+1}.</span><input type="number" placeholder="kg" value="${set.weight}" onchange="updateLogData(${exIdx},${setIdx},'weight',this.value)"><input type="number" placeholder="Wdh" value="${set.reps}" onchange="updateLogData(${exIdx},${setIdx},'reps',this.value)"><button class="icon-btn" style="color:#f44; font-size:16px;" onclick="removeSet(${exIdx},${setIdx})">✕</button></div>`;
                });
                container.innerHTML += `<div class="log-exercise-card"><h4 style="margin:0 0 15px 0; color:var(--accent); border-bottom:1px solid var(--card-border); padding-bottom:5px;">${ex.name}</h4><div style="font-size:10px; display:grid; grid-template-columns:40px 1fr 1fr 40px; gap:10px; opacity:0.6; margin-bottom:5px; text-align:center;"><span>Satz</span><span>kg</span><span>Wdh</span><span></span></div>${setsHtml}<button class="btn" style="margin:10px 0 0 0;" onclick="addSet(${exIdx})">+ Satz</button></div>`;
            });
        }

        function updateLogData(exIdx, setIdx, field, val) { activeLogData[exIdx].sets[setIdx][field] = val; }
        function addSet(exIdx) {
            let lastW = "", lastR = "";
            const sets = activeLogData[exIdx].sets;
            if(sets.length > 0) { lastW = sets[sets.length-1].weight; lastR = sets[sets.length-1].reps; }
            activeLogData[exIdx].sets.push({ weight: lastW, reps: lastR });
            renderLogExercises();
        }
        function removeSet(exIdx, setIdx) { activeLogData[exIdx].sets.splice(setIdx, 1); if(activeLogData[exIdx].sets.length === 0) activeLogData[exIdx].sets.push({ weight: "", reps: "" }); renderLogExercises(); }
        function saveWorkoutLog() {
            if(!data.logs[selectedDateStr]) data.logs[selectedDateStr] = [];
            data.logs[selectedDateStr] = data.logs[selectedDateStr].filter(l => l.planId !== selectedPlanIdToLog);
            data.logs[selectedDateStr].push({ planId: selectedPlanIdToLog, exercises: JSON.parse(JSON.stringify(activeLogData)) });
            saveData(); alert("Training gespeichert!");
        }

        // --- AUDIO ---
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }

        function playSoundEffect(type) {
            initAudio();
            const t = audioCtx.currentTime;
            
            if (type === 'bell') {
                const osc1 = audioCtx.createOscillator(); const osc2 = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc1.type = 'sine'; osc1.frequency.setValueAtTime(800, t);
                osc2.type = 'sine'; osc2.frequency.setValueAtTime(1200, t);
                osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
                gain.gain.setValueAtTime(1, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
                osc1.start(t); osc2.start(t); osc1.stop(t + 1.5); osc2.stop(t + 1.5);
            } else if (type === 'whistle') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(2000, t); osc.frequency.linearRampToValueAtTime(2200, t + 0.1); osc.frequency.linearRampToValueAtTime(2000, t + 0.4);
                gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(0.5, t + 0.05); gain.gain.linearRampToValueAtTime(0, t + 0.4);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.4);
                setTimeout(() => {
                    if(!audioCtx) return; const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
                    o2.type = 'triangle'; o2.frequency.setValueAtTime(2200, audioCtx.currentTime);
                    g2.gain.setValueAtTime(0.5, audioCtx.currentTime); g2.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
                    o2.connect(g2); g2.connect(audioCtx.destination); o2.start(); o2.stop(audioCtx.currentTime + 0.5);
                }, 150);
            } else if (type === 'buzzer') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t);
                gain.gain.setValueAtTime(0.5, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 1);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 1);
            } else if (type === 'tick') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(600, t);
                gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.1);
            } else {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, t);
                gain.gain.setValueAtTime(0.5, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.3);
            }
        }

        // --- TIMER ---
        function updateTimerSettings() { if(timerState === 'idle') updateTimerDisplayUI(parseInt(document.getElementById('timer-work').value)); }
        function updateTimerDisplayUI(seconds) { const m = Math.floor(seconds/60).toString().padStart(2,'0'); const s = (seconds%60).toString().padStart(2,'0'); document.getElementById('timer-display').innerText = `${m}:${s}`; }

        function startTimer() {
            initAudio();
            if (timerState === 'idle') {
                totalRounds = parseInt(document.getElementById('timer-rounds').value);
                currentRound = 1; timeLeft = parseInt(document.getElementById('timer-work').value); timerState = 'work';
                document.getElementById('timer-status').innerText = `Runde ${currentRound} von ${totalRounds} - ARBEIT!`;
                playSoundEffect(data.settings.soundWork);
            } else if (timerState === 'paused') {
                timerState = document.getElementById('timer-status').dataset.prevState;
                document.getElementById('timer-status').innerText = document.getElementById('timer-status').dataset.prevText;
            } else { return; }
            document.getElementById('btn-timer-start').style.display = 'none';
            document.getElementById('btn-timer-pause').style.display = 'block';
            clearInterval(timerInterval); timerInterval = setInterval(timerTick, 1000);
        }

        function pauseTimer() {
            if (timerState === 'work' || timerState === 'rest') {
                clearInterval(timerInterval);
                const status = document.getElementById('timer-status');
                status.dataset.prevState = timerState; status.dataset.prevText = status.innerText;
                timerState = 'paused'; status.innerText = "Pause (Angehalten)";
                document.getElementById('btn-timer-pause').style.display = 'none';
                document.getElementById('btn-timer-start').style.display = 'block'; document.getElementById('btn-timer-start').innerText = "▶ Weiter";
            }
        }

        function stopTimer() {
            clearInterval(timerInterval); timerState = 'idle';
            document.getElementById('timer-status').innerText = "Bereit"; document.getElementById('timer-display').style.color = "var(--accent)";
            document.getElementById('btn-timer-start').style.display = 'block'; document.getElementById('btn-timer-start').innerText = "▶ Start";
            document.getElementById('btn-timer-pause').style.display = 'none'; updateTimerSettings();
        }

        function timerTick() {
            if (timeLeft > 0) {
                timeLeft--;
                if (timeLeft <= 10 && timeLeft > 0) playSoundEffect('tick');
            } else {
                if (timerState === 'work') {
                    if (currentRound >= totalRounds) { stopTimer(); document.getElementById('timer-status').innerText = "Training beendet!"; playSoundEffect(data.settings.soundRest); return; }
                    timerState = 'rest'; timeLeft = parseInt(document.getElementById('timer-rest').value);
                    document.getElementById('timer-status').innerText = `Runde ${currentRound} - PAUSE`; document.getElementById('timer-display').style.color = "#f44";
                    playSoundEffect(data.settings.soundRest);
                } else if (timerState === 'rest') {
                    currentRound++; timerState = 'work'; timeLeft = parseInt(document.getElementById('timer-work').value);
                    document.getElementById('timer-status').innerText = `Runde ${currentRound} von ${totalRounds} - ARBEIT!`; document.getElementById('timer-display').style.color = "var(--accent)";
                    playSoundEffect(data.settings.soundWork);
                }
            }
            updateTimerDisplayUI(timeLeft);
        }

        // --- PROGRESS CHARTS ---
        function setupProgressScreen() {
            let uniqueEx = new Set();
            for(let d in data.logs) {
                data.logs[d].forEach(log => log.exercises.forEach(ex => uniqueEx.add(ex.name)));
            }
            const sel = document.getElementById('chart-exercise');
            sel.innerHTML = '';
            uniqueEx.forEach(ex => sel.innerHTML += `<option value="${ex}">${ex}</option>`);
            renderCharts();
        }

        function renderCharts() {
            const type = document.getElementById('chart-type').value;
            const exSel = document.getElementById('chart-exercise');
            const canvasCont = document.getElementById('canvas-container');
            const htmlCont = document.getElementById('html-chart-container');
            const ctx = document.getElementById('progressChart').getContext('2d');
            const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
            const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text-color').trim();

            if(chartInstance) chartInstance.destroy();
            canvasCont.style.display = 'none'; htmlCont.style.display = 'none'; exSel.style.display = 'none';

            if(type === 'max' || type === 'vol') {
                exSel.style.display = 'block'; canvasCont.style.display = 'block';
                const selectedEx = exSel.value;
                if(!selectedEx) return;

                let dates = [], values = [];
                let sortedDates = Object.keys(data.logs).sort();

                sortedDates.forEach(date => {
                    data.logs[date].forEach(log => {
                        const exData = log.exercises.find(e => e.name === selectedEx);
                        if(exData) {
                            dates.push(date);
                            if(type === 'max') {
                                let max = 0;
                                exData.sets.forEach(s => { let w = parseFloat(s.weight)||0; if(w>max) max=w; });
                                values.push(max);
                            } else {
                                let vol = 0;
                                exData.sets.forEach(s => { vol += (parseFloat(s.weight)||0) * (parseInt(s.reps)||0); });
                                values.push(vol);
                            }
                        }
                    });
                });

                chartInstance = new Chart(ctx, {
                    type: type==='max'?'line':'bar',
                    data: { labels: dates, datasets: [{ label: type==='max'?'Max Gewicht (kg)':'Volumen (kg)', data: values, backgroundColor: accent, borderColor: accent, tension: 0.3 }] },
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: textColor } }, y: { ticks: { color: textColor } } }, plugins: { legend: { labels: { color: textColor } } } }
                });
            } else if (type === 'muscle') {
                canvasCont.style.display = 'block';
                let counts = {};
                for(let d in data.logs) {
                    data.logs[d].forEach(log => {
                        log.exercises.forEach(ex => {
                            let cat = exerciseCategoryMap[ex.name] || 'Andere';
                            counts[cat] = (counts[cat] || 0) + 1;
                        });
                    });
                }
                const colors = ['#00bcd4', '#f44336', '#4caf50', '#ffeb3b', '#9c27b0', '#ff9800', '#795548'];
                chartInstance = new Chart(ctx, {
                    type: 'pie',
                    data: { labels: Object.keys(counts), datasets: [{ data: Object.values(counts), backgroundColor: colors.slice(0, Object.keys(counts).length) }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: textColor } } } }
                });
            } else if (type === 'heatmap') {
                htmlCont.style.display = 'block';
                let html = '<div class="heatmap-grid">';
                let today = new Date();
                for(let i=29; i>=0; i--) {
                    let d = new Date(today); d.setDate(today.getDate() - i);
                    let ds = d.toISOString().split('T')[0];
                    let intensity = 0;
                    if(data.logs[ds]) intensity = Math.min(data.logs[ds].length, 3);
                    html += `<div class="heatmap-box" data-intensity="${intensity}" title="${ds}"></div>`;
                }
                html += '</div><p style="text-align:center; font-size:12px; opacity:0.7; margin-top:5px;">Letzte 30 Tage</p>';
                htmlCont.innerHTML = html;
            } else if (type === 'records') {
                htmlCont.style.display = 'block';
                let records = {};
                for(let d in data.logs) {
                    data.logs[d].forEach(log => {
                        log.exercises.forEach(ex => {
                            let max = 0;
                            ex.sets.forEach(s => { let w = parseFloat(s.weight)||0; if(w>max) max=w; });
                            if(!records[ex.name] || max > records[ex.name]) records[ex.name] = max;
                        });
                    });
                }
                let html = '';
                for(let k in records) { html += `<div class="list-item"><span>${k}</span><strong style="color:var(--accent);">${records[k]} kg</strong></div>`; }
                if(html==='') html = '<p style="opacity:0.5;">Keine Rekorde gefunden.</p>';
                htmlCont.innerHTML = html;
            }
        }

        // --- PLAN CREATION & MANAGE ---
        function openExerciseModal() { document.getElementById('modal-exercise').style.display = 'flex'; }
        function addExerciseToPlan() { const custom = document.getElementById('custom-exercise').value.trim(); const xmlSelected = document.getElementById('xml-exercise-list').value; const exName = custom || xmlSelected; if(exName) { currentTempPlan.push(exName); renderTempPlan(); } document.getElementById('custom-exercise').value = ''; closeModals(); }
        function renderTempPlan() { const container = document.getElementById('plan-exercises'); container.innerHTML = ''; currentTempPlan.forEach((ex, idx) => { container.innerHTML += `<div class="list-item" style="padding:10px;">${ex} <button class="icon-btn" style="color:#f44;" onclick="removeTempEx(${idx})">✕</button></div>`; }); }
        function removeTempEx(idx) { currentTempPlan.splice(idx, 1); renderTempPlan(); }
        function savePlan() { const name = document.getElementById('plan-name').value.trim(); if(!name || currentTempPlan.length === 0) return alert("Fehlende Daten."); data.plans.push({ id: Date.now(), name: name, exercises: [...currentTempPlan] }); saveData(); document.getElementById('plan-name').value = ''; currentTempPlan = []; renderTempPlan(); alert("Plan gespeichert!"); }
        function renderManagePlans() { const list = document.getElementById('plans-list'); list.innerHTML = ''; data.plans.forEach(p => { list.innerHTML += `<div class="list-item"><div><strong>${p.name}</strong><br><small>${p.exercises.length} Übungen</small></div><button class="icon-btn" style="color:#f44;" onclick="deletePlan(${p.id})">✕</button></div>`; }); }
        function deletePlan(id) { if(confirm("Löschen?")) { data.plans = data.plans.filter(p => p.id !== id); saveData(); renderManagePlans(); } }
        function exportData() { const b = new Blob([JSON.stringify(data)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'fitlicious_backup.json'; a.click(); toggleMenu(); }
        function importData(e) { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = (e) => { try { data = JSON.parse(e.target.result); saveData(); renderCalendar(); alert("Geladen!"); } catch(err) { alert("Fehler!"); } }; r.readAsText(f); toggleMenu(); e.target.value = ''; }
    </script>
</body>
